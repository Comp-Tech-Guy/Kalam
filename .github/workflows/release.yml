name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "${{ github.ref }}" -replace '^refs/tags/v', ''
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Write version to tauri.conf.json
        shell: pwsh
        working-directory: app
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = "${{ steps.version.outputs.version }}"
          $json | ConvertTo-Json -Depth 32 | Set-Content $path

      - name: Update package.json version
        shell: pwsh
        working-directory: app
        run: |
          $path = "package.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = "${{ steps.version.outputs.version }}"
          $json | ConvertTo-Json -Depth 32 | Set-Content $path

      - name: Update Cargo.toml version
        shell: pwsh
        working-directory: app/src-tauri
        run: |
          $path = "Cargo.toml"
          $content = Get-Content $path -Raw
          $content = $content -replace '(?<=^version = ")[^"]+', "${{ steps.version.outputs.version }}"
          Set-Content $path $content

      - name: Update README.md badge
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          (Get-Content README.md -Raw) -replace 'version-\d+\.\d+\.\d+-blue', "version-$ver-blue" | Set-Content README.md

      - name: Commit and push version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/src-tauri/tauri.conf.json app/src-tauri/Cargo.toml README.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "v${{ steps.version.outputs.version }}"
            git push
          } else {
            Write-Host "No version changes to commit — files already match."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sidecar binary
        shell: pwsh
        working-directory: sidecar
        run: |
          pip install pyinstaller
          python -m PyInstaller kalam-core.spec --noconfirm
          New-Item -ItemType Directory -Force ../app/src-tauri/binaries/kalam-core | Out-Null
          Copy-Item dist/kalam-core-x86_64-pc-windows-msvc.exe ../app/src-tauri/binaries/kalam-core/ -Force

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: See the assets to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles msi
